name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Existing validated Central deployment ID to publish
        required: true
        type: string
      tag:
        description: Existing release tag for the GitHub release and artifacts
        required: true
        type: string

jobs:
  build-and-test:
    if: github.event_name == 'push'
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify -pl '!it-tests'

  integration-tests:
    if: github.event_name == 'push'
    name: Integration Tests (${{ matrix.spark_profile }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        spark_profile: [ 'spark35', 'spark35-scala212', 'spark40', 'spark41' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run integration tests
        run: mvn -B verify -pl it-tests -am -P${{ matrix.spark_profile }}

  publish:
    if: github.event_name == 'push'
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    needs: [ build-and-test, integration-tests ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build and deploy with release profile
        run: mvn -B deploy -Prelease -DskipTests -pl '!it-tests,!shared-tests,!spark35-tests,!spark35_2.12-tests,!spark40-tests,!spark41-tests'
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            core/target/spark-rabbitmq-streams-connector-core-*.jar
            spark35/target/spark-rabbitmq-streams-connector-spark35-*.jar
            spark35_2.12/target/spark-rabbitmq-streams-connector-spark35_2.12-*.jar
            spark40/target/spark-rabbitmq-streams-connector-spark40-*.jar
            spark41/target/spark-rabbitmq-streams-connector-spark41-*.jar

  recover-publish:
    if: github.event_name == 'workflow_dispatch'
    name: Publish Existing Central Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Publish validated Central deployment
        env:
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          status_url="https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID"
          deployment_url="https://central.sonatype.com/api/v1/publisher/deployment/$DEPLOYMENT_ID"

          response="$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $auth" "$status_url")"
          state="$(jq -r '.deploymentState' <<<"$response")"
          echo "Central deployment state: $state"

          case "$state" in
            VALIDATED)
              curl --fail --silent --show-error --request POST \
                --header "Authorization: Bearer $auth" "$deployment_url"
              ;;
            PUBLISHING|PUBLISHED)
              ;;
            *)
              echo "Deployment must be VALIDATED, PUBLISHING, or PUBLISHED; got $state" >&2
              exit 1
              ;;
          esac

          for attempt in $(seq 1 180); do
            response="$(curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $auth" "$status_url")"
            state="$(jq -r '.deploymentState' <<<"$response")"
            echo "Central deployment state (poll $attempt): $state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED)
                jq -r '.errors[]? // "Central deployment failed"' <<<"$response" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out after 30 minutes waiting for Central deployment to publish" >&2
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Extract version from tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build GitHub release artifacts
        run: mvn -B verify -Prelease -DskipTests -Dgpg.skip=true -pl '!it-tests,!shared-tests,!spark35-tests,!spark35_2.12-tests,!spark40-tests,!spark41-tests'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            core/target/spark-rabbitmq-streams-connector-core-*.jar
            spark35/target/spark-rabbitmq-streams-connector-spark35-*.jar
            spark35_2.12/target/spark-rabbitmq-streams-connector-spark35_2.12-*.jar
            spark40/target/spark-rabbitmq-streams-connector-spark40-*.jar
            spark41/target/spark-rabbitmq-streams-connector-spark41-*.jar
